<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply Room · Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f2;--panel:#fff;--ink:#12303a;--mute:#5b727a;--line:#d5e0de;--ok:#1f8a70;--low:#b86e00;--out:#c23b3b;--brand:#12303a;--hi:#ffd23f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1c20;--panel:#172a30;--ink:#e6f0ee;--mute:#93aab1;--line:#2a4249;--ok:#4cc3a4;--low:#f0a53a;--out:#ee7070;--brand:#e6f0ee;--hi:#ffd23f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo i{width:14px;height:22px;background:var(--hi);border-radius:3px;border:2px solid var(--brand);display:inline-block}
header span{color:var(--mute);font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:24px 28px;max-width:1180px;margin:0 auto}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em;font-weight:800}
.sub{color:var(--mute);margin:0 0 18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip,.bar button,.bar input{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.bar input{cursor:text;border-radius:8px;min-width:170px}
.bar .spacer{flex:1}
.addall{background:var(--hi)!important;color:#12303a!important;border-color:#12303a!important;font-weight:600}
.table{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(150px,1.5fr) minmax(130px,1.3fr) 130px 110px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.head{font-size:13px;color:var(--mute);background:var(--bg)}
.name b{display:block;font-weight:600}
.name small{color:var(--mute)}
.lvl{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.lvl div{height:100%;border-radius:4px}
.qty{font-size:13px;color:var(--mute);margin-top:4px}
.tag{font-size:13px;font-weight:600}
.ok{color:var(--ok)}.low{color:var(--low)}.out{color:var(--out)}
.bg-ok{background:var(--ok)}.bg-low{background:var(--low)}.bg-out{background:var(--out)}
.add{font:inherit;font-size:14px;padding:7px 10px;border-radius:8px;border:1px solid var(--brand);background:transparent;color:var(--ink);cursor:pointer;font-weight:600}
.add:hover{background:var(--brand);color:var(--bg)}
.add:disabled{opacity:.45;cursor:default;background:transparent;color:var(--ink)}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;align-self:start;position:sticky;top:16px}
aside h2{margin:0 0 4px;font-size:20px}
.empty{color:var(--mute);font-size:14px;padding:14px 0}
.sup{margin-top:14px}
.sup h3{font-size:14px;margin:0 0 6px;display:flex;justify-content:space-between;border-bottom:2px solid var(--hi);padding-bottom:4px}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:5px 0}
.step{display:inline-flex;align-items:center;gap:6px;margin-top:2px}
.step button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font:inherit}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:16px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
.buy{width:100%;font:inherit;font-weight:800;font-size:16px;padding:12px;border-radius:8px;border:2px solid var(--brand);background:var(--hi);color:#12303a;cursor:pointer}
.buy:disabled{opacity:.45;cursor:default}
.note{font-size:12px;color:var(--mute);margin-top:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--brand);color:var(--bg);padding:12px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
@media(max-width:860px){main{grid-template-columns:1fr;padding:16px}aside{position:static}.row{grid-template-columns:1fr 1fr}.head{display:none}header{padding:14px 16px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
.nav{display:flex;gap:6px}
.nav a{color:var(--ink);text-decoration:none;font-size:15px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid transparent}
.nav a[aria-current=page]{background:var(--brand);color:var(--bg)}
.nav a:not([aria-current]):hover{border-color:var(--line)}
.adj{display:inline-flex;align-items:center;gap:4px}
.adj button{width:30px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font:inherit;font-size:18px;line-height:1}
.adj button:hover{border-color:var(--brand)}
.adj input,.u input{font:inherit;width:62px;text-align:center;padding:6px 4px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
main.one{grid-template-columns:minmax(0,1fr);max-width:900px}
.u{grid-template-columns:minmax(150px,1.5fr) 130px 130px minmax(110px,1fr)}
.u label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.reset{font:inherit;font-size:14px;margin-top:16px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
@media(max-width:860px){.u{grid-template-columns:1fr 1fr}}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>Supply Room</div>
  <nav class="nav"><a href="index.html" aria-current="page">Stock</a><a href="usage.html">Daily usage</a></nav>
</header>
<main>
  <section>
    <h1 id="headline"></h1>
    <p class="sub">Stock drops each day by the amounts set on the Daily usage page. Use − and + when you use more or less, or when a delivery arrives. Everything is saved in this browser.</p>
    <div class="bar">
      <button class="chip" data-f="all" aria-pressed="true">All items</button>
      <button class="chip" data-f="low" aria-pressed="false">Running low</button>
      <button class="chip" data-f="ok" aria-pressed="false">Well stocked</button>
      <input id="q" type="search" placeholder="Search items" aria-label="Search items">
      <span class="spacer"></span>
      <button class="addall" id="addall">Add all low items</button>
    </div>
    <div class="table" id="table"></div>
  </section>
  <aside>
    <h2>Order cart</h2>
    <div id="cart"></div>
  </aside>
</main>
<div id="toast" role="status"></div>
<script>
// Shared by index.html and usage.html. Data is saved in this browser (localStorage).
const KEY = "supplyroom.v1";
const DEFAULTS = [
  {id:1, n:"Multi-surface spray", d:"750 ml bottle", s:"BrightSource", p:2.4, pack:6, have:3, rate:0.3, target:12},
  {id:2, n:"Thick bleach", d:"5 L bottle", s:"BrightSource", p:6.8, pack:2, have:2, rate:0.1, target:6},
  {id:3, n:"Toilet roll", d:"Single roll, ordered 36 at a time", s:"Trade Hygiene Co.", p:0.52, pack:36, have:12, rate:1, target:36},
  {id:4, n:"Hand soap refill", d:"1 L", s:"Trade Hygiene Co.", p:3.2, pack:4, have:4, rate:0.2, target:10},
  {id:5, n:"Paper hand towels", d:"Case of 15 packs", s:"Trade Hygiene Co.", p:24, pack:1, have:3, rate:0.1, target:5},
  {id:6, n:"Bin liners", d:"Roll of 100", s:"BrightSource", p:7.9, pack:2, have:6, rate:0.2, target:8},
  {id:7, n:"Disinfectant wipes", d:"Tub of 200", s:"BrightSource", p:4.5, pack:4, have:3, rate:0.3, target:10},
  {id:8, n:"Floor cleaner", d:"5 L bottle", s:"BrightSource", p:9.1, pack:1, have:4, rate:0.1, target:5},
  {id:9, n:"Nitrile gloves (M)", d:"Box of 100", s:"Trade Hygiene Co.", p:6.3, pack:4, have:7, rate:0.3, target:12},
  {id:10, n:"Microfibre cloths", d:"Pack of 10", s:"BrightSource", p:5.6, pack:2, have:5, rate:0.1, target:6},
  {id:11, n:"Dishwasher tablets", d:"Tub of 100", s:"Trade Hygiene Co.", p:11.2, pack:2, have:3, rate:0.2, target:6}
];
const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5); };
const r2 = v => Math.round(v * 100) / 100;
const r1 = v => Math.round(v * 10) / 10;
const fmt = v => String(r1(v));
const gbp = v => "£" + v.toFixed(2);

function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!s || !Array.isArray(s.items)) s = { items: DEFAULTS.map(x => ({ ...x })), last: today() };
  const days = today() - s.last;
  if (days > 0) { // stock drops by each item's daily usage for every day that has passed
    s.items.forEach(i => { i.have = Math.max(0, r2(i.have - i.rate * days)); });
    s.last = today();
  }
  save(s);
  return s;
}
function reset() { try { localStorage.removeItem(KEY); } catch (e) {} return load(); }

const stat = i => r1(i.have) <= 0 ? "out" : i.have / i.target <= 0.4 ? "low" : "ok";
const daysLeft = i => i.rate > 0 ? Math.floor(i.have / i.rate) : null;
function lasts(i) {
  if (r1(i.have) <= 0) return "Out now";
  const d = daysLeft(i);
  return d === null ? "No daily use set" : d === 0 ? "Less than a day" : "About " + d + (d === 1 ? " day" : " days");
}
function toast(t) {
  const e = document.getElementById("toast");
  e.textContent = t; e.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("show"), 2600);
}
</script>
<script>
const S = load(), items = S.items, cart = {};
let filter = "all", term = "";
const label = { ok: "Well stocked", low: "Running low", out: "Out of stock" };

function renderTable() {
  const low = items.filter(i => stat(i) !== "ok").length, out = items.filter(i => stat(i) === "out").length;
  document.getElementById("headline").textContent = low ? low + " items need reordering" + (out ? ", " + out + (out > 1 ? " are" : " is") + " out" : "") : "Everything is well stocked";
  const list = items.filter(i => (filter === "all" || (filter === "low" ? stat(i) !== "ok" : stat(i) === "ok")) && i.n.toLowerCase().includes(term));
  let h = '<div class="row head"><div>Item</div><div>Stock</div><div>Adjust stock</div><div></div></div>';
  list.forEach(i => {
    const s = stat(i), pct = Math.min(100, Math.max(4, i.have / i.target * 100));
    h += `<div class="row"><div class="name"><b>${i.n}</b><small>${i.d} · ${gbp(i.p)} each · ${i.s}</small></div>
    <div><div class="lvl" aria-hidden="true"><div class="bg-${s}" style="width:${pct}%"></div></div>
    <div class="qty"><span class="tag ${s}">${label[s]}</span> · ${lasts(i)}</div></div>
    <div class="adj"><button data-d="-1" data-id="${i.id}" aria-label="Remove one ${i.n}">−</button><input type="number" min="0" step="any" value="${fmt(i.have)}" data-set="${i.id}" aria-label="${i.n} in stock"><button data-d="1" data-id="${i.id}" aria-label="Add one ${i.n}">+</button></div>
    <div><button class="add" data-cart="${i.id}" ${cart[i.id] ? "disabled" : ""}>${cart[i.id] ? "In cart" : "Add to cart"}</button></div></div>`;
  });
  if (!list.length) h += '<div class="row"><div class="empty">No items match. Clear the search or pick another filter.</div></div>';
  document.getElementById("table").innerHTML = h;
}

function renderCart() {
  const ids = Object.keys(cart), el = document.getElementById("cart");
  if (!ids.length) { el.innerHTML = '<p class="empty">Your cart is empty. Add items that are running low and they will be grouped by supplier here.</p>'; return; }
  const g = {};
  ids.forEach(id => { const i = items.find(x => x.id == id); (g[i.s] = g[i.s] || []).push(i); });
  let total = 0, h = "";
  Object.keys(g).forEach(s => {
    let sub = 0, l = "";
    g[s].forEach(i => {
      sub += i.p * cart[i.id];
      l += `<div class="line"><span>${i.n}<br><span class="step"><button data-m="${i.id}" aria-label="Fewer ${i.n}">−</button>${cart[i.id]}<button data-p="${i.id}" aria-label="More ${i.n}">+</button></span></span><span>${gbp(i.p * cart[i.id])}</span></div>`;
    });
    total += sub;
    h += `<div class="sup"><h3><span>${s}</span><span>${gbp(sub)}</span></h3>${l}</div>`;
  });
  const n = Object.keys(g).length;
  h += `<div class="total"><span>Total</span><span>${gbp(total)}</span></div><button class="buy" id="buy">Place ${n} order${n > 1 ? "s" : ""}</button><p class="note">Demo only. Real ordering would need to be connected to each supplier. Stock changes when you add it with + after delivery.</p>`;
  el.innerHTML = h;
}

const render = () => { renderTable(); renderCart(); };
const setHave = (id, v) => { const i = items.find(x => x.id == id); i.have = Math.max(0, r2(v)); save(S); render(); };

document.addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.d) { const i = items.find(x => x.id == t.dataset.id); setHave(i.id, i.have + Number(t.dataset.d)); }
  else if (t.dataset.cart) { cart[t.dataset.cart] = items.find(i => i.id == t.dataset.cart).pack; render(); }
  else if (t.dataset.p) { cart[t.dataset.p]++; renderCart(); }
  else if (t.dataset.m) { if (--cart[t.dataset.m] < 1) delete cart[t.dataset.m]; render(); }
  else if (t.dataset.f) { filter = t.dataset.f; document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === t)); renderTable(); }
  else if (t.id === "addall") { items.filter(i => stat(i) !== "ok").forEach(i => { if (!cart[i.id]) cart[i.id] = i.pack; }); render(); toast("Added every low item to the cart"); }
  else if (t.id === "buy") { const n = new Set(Object.keys(cart).map(id => items.find(i => i.id == id).s)).size; Object.keys(cart).forEach(k => delete cart[k]); render(); toast(n + " order" + (n > 1 ? "s" : "") + " sent (demo)"); }
});
document.addEventListener("change", e => {
  if (e.target.dataset.set) { const v = parseFloat(e.target.value); setHave(e.target.dataset.set, isNaN(v) ? 0 : v); }
});
document.getElementById("q").addEventListener("input", e => { term = e.target.value.toLowerCase(); renderTable(); });
render();
</script>
</body>
</html>
