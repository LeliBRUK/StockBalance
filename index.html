<script>
// Shared by every page. All data is saved in this browser (localStorage).
const KEY = "stockbalance.v1";
const CATS = ["Cleaning and waste", "Boxes", "Packing materials", "Labels and paper"];

function P(shop, price, vat, url, est) { return { shop, price, vat: vat || "", url: url || "", est: !!est }; }
const U = {
  raja: "https://www.rajapack.co.uk/cardboard-boxes/standard-boxes_C1010.html",
  globe: "https://www.globepackaging.co.uk/learning/best-boxes-for-shipping-electronics-types-prices-where-to-buy"
};

// Starter suppliers: these are where the prices below were found. Replace them with your own on the Shops page.
const SHOPS0 = [
  ["cfs", "CFS", "https://www.cfsnet.co.uk/"],
  ["gtse", "GTSE", "https://gtse.co.uk/"],
  ["aos", "AOS Online", "https://www.aosonline.co.uk/"],
  ["safety", "The Safety Supply Company", "https://www.thesafetysupplycompany.co.uk/"],
  ["raja", "Rajapack", "https://www.rajapack.co.uk/"],
  ["globe", "Globe Packaging", "https://www.globepackaging.co.uk/"],
  ["mailcoms", "Mailcoms", "https://shop.mailcoms.co.uk/"],
  ["cableties", "Cableties.co.uk", "https://cableties.co.uk/"],
  ["smartuk", "SmartUK", "https://www.smartuk.net/"],
  ["pronto", "Pronto Direct", "https://www.prontodirect.co.uk/"],
  ["cdm", "CDM Labels", "https://cdmlabels.co.uk/"]
].map(([id, name, url]) => ({ id, name, url, notes: "" }));

// id, name, detail, category, usual order quantity, in stock, used per day, level shown as full, shops
const ITEMS0 = [
  [1, "Isopropyl alcohol (IPA)", "5 L bottle", "Cleaning and waste", 2, 3, 0.1, 6, [P("cfs", 21.60, "inc", "https://www.cfsnet.co.uk/s-ais002%2d005/isopropyl-alcohol-5-litre/")]],
  [2, "Sticker remover", "400 ml can", "Cleaning and waste", 12, 5, 0.15, 12, [P("gtse", 3.36, "", "https://gtse.co.uk/label-remover-spray-400ml-box-of-12")]],
  [3, "Compressed air spray", "400 ml can", "Cleaning and waste", 6, 4, 0.3, 12, [P("gtse", 3.51, "", "https://gtse.co.uk/air-duster-400ml")]],
  [4, "Window cleaner", "5 L bottle", "Cleaning and waste", 2, 2, 0.1, 4, [P("aos", 10.56, "inc", "https://www.aosonline.co.uk/prdctrl-2work-glass-and-window-cleaner-5-litre-701-846beae4")]],
  [5, "All-purpose foam cleaner", "500 ml can", "Cleaning and waste", 6, 3, 0.2, 8, [P("safety", 4.32, "inc", "https://www.thesafetysupplycompany.co.uk/p/9537228/prosolve-odourless-foam-cleaner-500ml-pv-ofc5a")]],
  [6, "Bin bags", "Pack of 100", "Cleaning and waste", 2, 3, 0.1, 6, [P("smartuk", 16.28, "ex", "https://www.smartuk.net/bin-bags/")]],
  [7, "Small box", "Single wall cardboard", "Boxes", 50, 60, 5, 150, [P("raja", 0.45, "ex", U.raja)]],
  [8, "Medium box", "Single wall cardboard", "Boxes", 50, 40, 4, 100, [P("raja", 0.51, "ex", U.raja)]],
  [9, "Large box", "Single wall cardboard", "Boxes", 25, 25, 2, 60, [P("raja", 1.34, "ex", U.raja)]],
  [10, "Laptop box", "Double wall cardboard", "Boxes", 10, 12, 1, 30, [P("globe", 2.10, "ex", U.globe)]],
  [11, "Phone box", "Small cardboard box", "Boxes", 50, 30, 3, 60, [P("globe", 1.00, "ex", U.globe, true)]],
  [12, "Screen box", "Double wall, monitor size", "Boxes", 5, 8, 0.5, 20, [P("globe", 4.19, "ex", U.globe)]],
  [13, "Support box (inner)", "Holds a laptop steady inside a bigger box", "Boxes", 25, 20, 1.5, 40, [P("raja", 0.45, "ex", U.raja, true)]],
  [14, "Honeycomb paper", "500 mm × 250 m roll", "Packing materials", 1, 2, 0.05, 4, [P("aos", 65.64, "inc", "https://www.aosonline.co.uk/prdctrl-honeycomb-kraft-paper-80gsm-500mmx250m-lwp80hex-ac1efec5")]],
  [15, "Masking tape", "24 mm × 50 m roll", "Packing materials", 24, 15, 0.5, 36, [P("cableties", 0.97, "", "https://cableties.co.uk/products/box-of-masking-tape-24mm")]],
  [16, "Brown tape", "48 mm × 66 m roll", "Packing materials", 12, 10, 1, 36, [P("mailcoms", 1.60, "inc", "https://shop.mailcoms.co.uk/products/rolls-of-brown-packing-parcel-tape-48mmx66m")]],
  [17, "Love labels", "Roll", "Labels and paper", 1, 6, 0.4, 12, []],
  [18, "Receipt paper", "80 × 80 mm thermal roll", "Labels and paper", 20, 25, 1.5, 60, [P("pronto", 0.85, "inc", "https://www.prontodirect.co.uk/thermal-till-roll-80-x-80mm/")]],
  [19, "Standard labels", "100 × 150 mm thermal roll", "Labels and paper", 12, 14, 0.8, 36, [P("cdm", 3.95, "", "https://cdmlabels.co.uk/products/100-x-150mm-direct-thermal-labels-economy-25mm-core")]]
].map(([id, n, d, cat, pack, have, rate, target, src]) => ({ id, n, d, cat, pack, have, rate, target, src }));

const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5); };
const r2 = v => Math.round(v * 100) / 100;
const r1 = v => Math.round(v * 10) / 10;
const fmt = v => String(r1(v));
const gbp = v => "£" + Number(v).toFixed(2);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function fresh() {
  return { shops: SHOPS0.map(s => ({ ...s })), items: ITEMS0.map(i => ({ ...i, src: i.src.map(x => ({ ...x })) })), last: today() };
}
function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!s || !Array.isArray(s.shops) || !Array.isArray(s.items)) s = fresh();
  const days = today() - s.last;
  if (days > 0) { // stock drops by each item's daily usage for every day that has passed
    s.items.forEach(i => { i.have = Math.max(0, r2(i.have - i.rate * days)); });
    s.last = today();
  }
  save(s);
  return s;
}
function reset() { try { localStorage.removeItem(KEY); } catch (e) {} return load(); }

const stat = i => r1(i.have) <= 0 ? "out" : i.have / i.target <= 0.4 ? "low" : "ok";
function lasts(i) {
  if (r1(i.have) <= 0) return "Out now";
  if (!(i.rate > 0)) return "No daily use set";
  const d = Math.floor(i.have / i.rate);
  return d === 0 ? "Less than a day" : "About " + d + (d === 1 ? " day" : " days");
}
const groups = list => CATS.map(c => ({ c, items: list.filter(i => i.cat === c) })).filter(g => g.items.length);
const shopOf = (S, id) => S.shops.find(s => s.id === id);
const shopName = (S, id) => { const s = shopOf(S, id); return s ? s.name : "Unknown shop"; };
function cheapest(i) {
  const p = i.src.filter(x => x.price != null);
  if (p.length) return p.reduce((a, b) => b.price < a.price ? b : a);
  return i.src[0] || null;
}
const vatText = v => v === "inc" ? "inc VAT" : v === "ex" ? "ex VAT" : "VAT not stated";

function toast(t) {
  const e = document.getElementById("toast");
  if (!e) return;
  e.textContent = t; e.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("show"), 2600);
}
document.addEventListener("click", e => {
  if (e.target.id === "signout") {
    try { sessionStorage.removeItem("sb.auth"); localStorage.removeItem("sb.auth"); } catch (x) {}
    location.href = "login.html";
  }
});
</script>
<script>
const S = load(), items = S.items, cart = {};
let filter = "all", cat = "all", term = "";
const label = { ok: "Well stocked", low: "Running low", out: "Out of stock" };
const srcOf = (i, shop) => i.src.find(x => x.shop === shop);

document.getElementById("cat").innerHTML = '<option value="all">All categories</option>' + CATS.map(c => `<option>${c}</option>`).join("");

function renderTable() {
  const low = items.filter(i => stat(i) !== "ok").length, out = items.filter(i => stat(i) === "out").length;
  document.getElementById("headline").textContent = low ? low + " items need reordering" + (out ? ", " + out + (out > 1 ? " are" : " is") + " out" : "") : "Everything is well stocked";
  const list = items.filter(i => (filter === "all" || (filter === "low" ? stat(i) !== "ok" : stat(i) === "ok")) && (cat === "all" || i.cat === cat) && i.n.toLowerCase().includes(term));
  let h = '<div class="row head"><div>Item</div><div>Stock</div><div>Adjust stock</div><div></div></div>';
  groups(list).forEach(g => {
    h += `<div class="cat"><span>${g.c}</span><span>${g.items.length} item${g.items.length > 1 ? "s" : ""}</span></div>`;
    g.items.forEach(i => {
      const s = stat(i), pct = Math.min(100, Math.max(4, i.have / i.target * 100)), ch = cheapest(i);
      const price = ch && ch.price != null ? " · from " + gbp(ch.price) + " each" : "";
      const btn = i.src.length
        ? `<button class="add" data-cart="${i.id}" ${cart[i.id] ? "disabled" : ""}>${cart[i.id] ? "In cart" : "Add to cart"}</button>`
        : `<a class="add" href="shops.html#item-${i.id}">Link a shop</a>`;
      h += `<div class="row"><div class="name"><b>${esc(i.n)}</b><small>${esc(i.d)}${price}</small></div>
      <div><div class="lvl" aria-hidden="true"><div class="bg-${s}" style="width:${pct}%"></div></div>
      <div class="qty"><span class="tag ${s}">${label[s]}</span> · ${lasts(i)}</div></div>
      <div class="adj"><button data-d="-1" data-id="${i.id}" aria-label="Remove one ${esc(i.n)}">−</button><input type="number" min="0" step="any" value="${fmt(i.have)}" data-set="${i.id}" aria-label="${esc(i.n)} in stock"><button data-d="1" data-id="${i.id}" aria-label="Add one ${esc(i.n)}">+</button></div>
      <div>${btn}</div></div>`;
    });
  });
  if (!list.length) h += '<div class="row"><div class="empty">No items match. Clear the search or pick another filter.</div></div>';
  document.getElementById("table").innerHTML = h;
}

function addToCart(i) {
  const ch = cheapest(i);
  if (!ch) return false;
  cart[i.id] = { q: i.pack, shop: ch.shop };
  return true;
}

function renderCart() {
  const ids = Object.keys(cart), el = document.getElementById("cart");
  if (!ids.length) { el.innerHTML = '<p class="empty">Your cart is empty. Add items that are running low and they will be grouped by shop here.</p>'; return; }
  const g = {};
  ids.forEach(id => { const i = items.find(x => x.id == id); (g[cart[id].shop] = g[cart[id].shop] || []).push(i); });
  let total = 0, missing = false, h = "";
  Object.keys(g).forEach(sh => {
    let sub = 0, l = "";
    g[sh].forEach(i => {
      const c = cart[i.id], s = srcOf(i, sh), p = s && s.price != null ? s.price : null;
      if (p == null) missing = true;
      const lp = (p || 0) * c.q; sub += lp;
      const opts = i.src.map(x => `<option value="${esc(x.shop)}"${x.shop === sh ? " selected" : ""}>${esc(shopName(S, x.shop))}${x.price != null ? " · " + gbp(x.price) : ""}</option>`).join("");
      l += `<div class="line"><span>${esc(i.n)}<br><span class="step"><button data-m="${i.id}" aria-label="Fewer ${esc(i.n)}">−</button>${c.q}<button data-p="${i.id}" aria-label="More ${esc(i.n)}">+</button></span><br><select class="mini" data-shop="${i.id}" aria-label="Shop for ${esc(i.n)}">${opts}</select></span><span>${p == null ? "No price" : gbp(lp)}</span></div>`;
    });
    total += sub;
    h += `<div class="sup"><h3><span>${esc(shopName(S, sh))}</span><span>${gbp(sub)}</span></h3>${l}</div>`;
  });
  const n = Object.keys(g).length;
  h += `<div class="total"><span>Total</span><span>${gbp(total)}</span></div><button class="buy" id="buy">Place ${n} order${n > 1 ? "s" : ""}</button><p class="note">Demo only: nothing is ordered. Prices come from the Shops page and some are ex VAT.${missing ? " Some items have no price yet." : ""} After a delivery arrives, add it to stock with +.</p>`;
  el.innerHTML = h;
}

const render = () => { renderTable(); renderCart(); };
const setHave = (id, v) => { const i = items.find(x => x.id == id); i.have = Math.max(0, r2(v)); save(S); render(); };

document.addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.d) { const i = items.find(x => x.id == t.dataset.id); setHave(i.id, i.have + Number(t.dataset.d)); }
  else if (t.dataset.cart) { addToCart(items.find(i => i.id == t.dataset.cart)); render(); }
  else if (t.dataset.p) { cart[t.dataset.p].q++; renderCart(); }
  else if (t.dataset.m) { if (--cart[t.dataset.m].q < 1) delete cart[t.dataset.m]; render(); }
  else if (t.dataset.f) { filter = t.dataset.f; document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === t)); renderTable(); }
  else if (t.id === "addall") {
    let added = 0, skipped = 0;
    items.filter(i => stat(i) !== "ok").forEach(i => { if (cart[i.id]) return; if (addToCart(i)) added++; else skipped++; });
    render();
    toast(added ? "Added " + added + " low item" + (added > 1 ? "s" : "") + " to the cart" + (skipped ? ". " + skipped + " need a shop linked first" : "") : skipped ? skipped + " low item" + (skipped > 1 ? "s need" : " needs") + " a shop linked first" : "No low items to add");
  }
  else if (t.id === "buy") { const n = new Set(Object.keys(cart).map(id => cart[id].shop)).size; Object.keys(cart).forEach(k => delete cart[k]); render(); toast(n + " order" + (n > 1 ? "s" : "") + " sent (demo)"); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.set) { const v = parseFloat(t.value); setHave(t.dataset.set, isNaN(v) ? 0 : v); }
  else if (t.dataset.shop) { cart[t.dataset.shop].shop = t.value; renderCart(); }
  else if (t.id === "cat") { cat = t.value; renderTable(); }
});
document.getElementById("q").addEventListener("input", e => { term = e.target.value.toLowerCase(); renderTable(); });
render();
</script>
</body>
